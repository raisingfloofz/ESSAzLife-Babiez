<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>ESSAzLife Babiez</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#161616;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#app{min-height:100dvh;display:flex;justify-content:center}.shell{width:min(100%,520px);min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 25px #0001}.top{padding:18px 20px 10px;border-bottom:2px solid #111;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;letter-spacing:.03em;font-size:1.05rem}.tiny{font-size:.75rem;color:#666}.content{padding:22px 20px;flex:1;display:flex;flex-direction:column;gap:16px;overflow:auto}.content h1{font-size:clamp(1.45rem,5vw,2rem);line-height:1.15;margin:0}.content h2{font-size:1.2rem;margin:0}.content p{margin:0;line-height:1.45}.muted{color:#626262}.footer{position:sticky;bottom:0;background:white;border-top:1px solid #ddd;padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}.btn{border:2px solid #111;background:#111;color:#fff;padding:12px 15px;border-radius:12px;font-weight:750;min-height:46px}.btn.alt{background:#fff;color:#111}.btn.subtle{border-color:#ddd;background:#f6f6f6;color:#111}.footer .btn{flex:1}.link{background:none;border:0;padding:0;color:#1556d4;text-decoration:underline;font-weight:650;text-align:left}.field{display:flex;flex-direction:column;gap:6px;font-weight:650}.field input,.field select{width:100%;padding:12px;border:2px solid #bbb;border-radius:10px;background:white;min-height:46px}.card{border:2px solid #ddd;border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px}.card.selected{border-color:#111;background:#f6f6f6}.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid #ddd;background:white;border-radius:13px;padding:14px;font-weight:700;min-height:56px}.choice.selected{border-color:#111;background:#f2f2f2}.choice .grow{flex:1}.pill{display:inline-block;padding:4px 8px;border:1px solid #ccc;border-radius:99px;font-size:.75rem}.status{padding:12px;border-radius:10px;background:#f1f1f1;font-size:.92rem}.ok{color:#167b34;font-weight:900}.bad{color:#b52d2d;font-weight:900}.gradeA,.gradeB{color:#16843a}.gradeC{color:#a77900}.gradeD,.gradeF{color:#bc2929}.score{font-size:3.6rem;font-weight:900;line-height:1}.progress{height:9px;background:#ddd;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#111}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:.86rem}.notice{border-left:4px solid #111;padding:9px 12px;background:#f5f5f5}.center{text-align:center}.grow{flex:1}.right{margin-left:auto}.tag{font-size:.76rem;background:#eee;border-radius:6px;padding:4px 7px;overflow-wrap:anywhere}.checkrow{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.checkrow strong{flex:1}.scrolllist{max-height:40dvh;overflow:auto;padding-right:3px}.hide{display:none!important}.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;max-width:92vw;text-align:center;box-shadow:0 6px 24px #0004}.warning{color:#b52d2d;font-weight:700}@media(max-height:720px){.content{padding-top:14px;gap:11px}.card{padding:10px}.top{padding:12px 18px 8px}.choice{padding:10px;min-height:44px}} 
</style></head><body><div id="app"></div><script>
'use strict';
const KEY='essazlife-babiez-v3';
const ROLES=['Mom','Dad','Grandma','Grandpa','Aunt','Uncle','Sibling','Babysitter','Guardian','Custom'];
const ITEMS=[['bottle','Bottle'],['diaper1','Diaper #1'],['diaper2','Diaper #2'],['wipes','Baby Wipes'],['cream','Diaper Rash Cream'],['thermometer','Thermometer'],['teether','Teething Ring'],['soap','Soap'],['sleep','Safe Sleeping Spot'],['carseat','Car Seat'],['medicine','Medicine'],['aspirator','Nasal Aspirator'],['pacifier','Pacifier']];
const REQUIRED=ITEMS.filter(x=>x[0]!=='pacifier');
const DEMO_IDS=Object.fromEntries(ITEMS.map(([k])=>[k,'ESSAZ-'+({diaper1:'DIAPER1',diaper2:'DIAPER2',sleep:'SLEEP',teether:'TEETHER',carseat:'CARSEAT',aspirator:'ASPIRATOR',cream:'CREAM'}[k]||k.toUpperCase())+'-DEMO']));
const NEEDS=[{id:'feed',label:'Hungry baby',item:'bottle',prompt:'Scan the bottle NFC sticker.',message:'Neh… baby is hungry.'},{id:'diaper',label:'Diaper change',item:'diaper1',prompt:'Scan either diaper sticker.',message:'Baby needs a fresh diaper.'},{id:'wipe',label:'Wipe baby',item:'wipes',prompt:'Scan baby wipes.',message:'Time to clean baby.'},{id:'cream',label:'Apply rash cream',item:'cream',prompt:'Scan diaper rash cream.',message:'Baby has a little diaper irritation.'},{id:'temperature',label:'Check temperature',item:'thermometer',prompt:'Scan the thermometer.',message:'Baby feels warm.'},{id:'sleep',label:'Sleepy baby',item:'sleep',prompt:'Scan the safe sleeping spot.',message:'Owh… baby is sleepy.'},{id:'bath',label:'Bath time',item:'soap',prompt:'Scan the soap.',message:'Baby needs a bath.'},{id:'outing',label:'Car seat',item:'carseat',prompt:'Scan the car seat.',message:'Time for an outing.'},{id:'medicine',label:'Medicine check',item:'medicine',prompt:'Scan the medicine bottle.',message:'Follow the simulated care plan.'},{id:'nose',label:'Stuffy nose',item:'aspirator',prompt:'Scan the nasal aspirator.',message:'Baby sounds stuffy.'},{id:'diaper2',label:'Another diaper change',item:'diaper2',prompt:'Scan the second diaper sticker.',message:'Baby needs another diaper.'},{id:'pacifier',label:'Comfort baby',item:'pacifier',prompt:'Scan the pacifier or caregiver band.',message:'Baby wants comforting.'},{id:'teether',label:'Teething',item:'teether',prompt:'Scan the teething ring.',message:'Baby wants to chew.'}];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{};}catch{db={}};
db.caregivers ||= [];db.babies ||= [];db.tags ||= {};db.reports ||= [];db.settings ||= {helpUrl:''};
let page='home', wizard=null, session=null, pendingScan=null, nfcController=null, scannerActive=false, toastTimer=null, tickTimer=null, audioCtx=null, toneEnabled=true;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const babyById=id=>db.babies.find(x=>x.id===id);
const caregiverById=id=>db.caregivers.find(x=>x.id===id);
const ageMonths=b=>b?.ageMode==='birth'&&b.birth?Math.max(0,Math.min(24,Math.floor((Date.now()-new Date(b.birth+'T12:00:00').getTime())/2629800000))):Number(b?.months||0);
const neededItems=b=>REQUIRED.filter(([k])=>k!=='teether'||ageMonths(b)>=3);
const allRegistered=b=>neededItems(b).every(([k])=>!!db.tags[k]);
const $=id=>document.getElementById(id);
function showToast(msg){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.append(el)}el.textContent=msg;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),3400)}
function beep(freq=520,ms=120){if(!toneEnabled)return;try{audioCtx ||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+ms/1000)}catch{}}
// Baby crying playback; uses crying.wav beside index.html.
const babyCry=new Audio('crying.wav');
babyCry.loop=true;
babyCry.preload='auto';
function stopBabyCry(){babyCry.pause();babyCry.currentTime=0;}
function syncBabyCry(){
  if(session?.running && !session.paused && session.need){
    if(babyCry.paused) babyCry.play().catch(err=>console.warn('Crying audio could not play:',err));
  }else stopBabyCry();
}
function render(){const app=$('app');app.innerHTML=`<main class="shell"><header class="top"><div><div class="brand">ESSAzLife Babiez 🍼</div><div class="tiny">NFC-powered baby care</div></div><button class="btn alt small" style="padding:7px 10px;min-height:36px" onclick="goHome()">Home</button></header><section class="content" id="screen"></section><footer class="footer" id="footer"></footer></main>`;const f=$('footer');if(!db.caregivers.length&&page==='home')page='welcome';({welcome:welcomeScreen,caregiver:caregiverScreen,caregiverMore:moreCaregiversScreen,baby:babyScreen,primary:primaryScreen,accessories:accessoriesScreen,home:homeScreen,choose:chooseScreen,modes:modesScreen,prepare:prepareScreen,live:liveScreen,report:reportScreen,settings:settingsScreen,reports:reportsScreen,help:helpScreen}[page]||homeScreen)();if(!f.children.length)f.classList.add('hide')}
function screen(html,buttons=[]){$('screen').innerHTML=html;const f=$('footer');f.innerHTML=buttons.map((b,i)=>`<button class="btn ${b.alt?'alt':''}" id="action${i}" ${b.disabled?'disabled':''}>${safe(b.label)}</button>`).join('');buttons.forEach((b,i)=>$('action'+i).onclick=b.fn)}
function goHome(){stopBabyCry();cancelPending();wizard=null;page='home';render()}
function beginWizard(kind){wizard={kind,babyId:null,caregiverId:null,step:kind==='first'?'caregiver':'baby'};page=wizard.step;render()}
function welcomeScreen(){screen(`<h1>Welcome to ESSAzLife Babiez.</h1><p>An app designed with NFC Tag use.</p><button class="link" onclick="page='help';render()">I need setup help</button><div class="card"><h2>Care for your baby, one tap at a time.</h2><p class="muted">Set up caregivers, babies, and NFC accessories. Then choose a simulation.</p></div><p class="small muted">For Android Chrome with NFC on, use HTTPS. Keep this page open while scanning.</p>`,[{label:'Get Started',fn:()=>beginWizard('first')}])}
function helpScreen(){screen(`<h1>Setup help</h1><p>Write an NDEF <b>text</b> record to each NFC sticker using an NFC writing app. You can use IDs such as <span class="tag">ESSAZ-BOTTLE-DEMO</span>, or let Babiez learn any unique text tag.</p><p>Tap <b>Scan Tag</b>, then hold your phone against the sticker. Chrome on Android requires NFC permission and HTTPS.</p><p class="notice">Video help: paste your YouTube URL in Settings. The help button will open YouTube directly, not an embedded player.</p><button class="btn alt" onclick="openHelpVideo()">Open YouTube setup video</button>`,[{label:'Back',alt:true,fn:()=>{page=db.caregivers.length?'home':'welcome';render()}}])}
function openHelpVideo(){if(!db.settings.helpUrl){showToast('Add your YouTube setup URL in Settings first.');return}window.open(db.settings.helpUrl,'_blank','noopener,noreferrer')}
function caregiverScreen(){screen(`<h1>Add your ${db.caregivers.length?'next':'first'} caregiver.</h1><label class="field">Caregiver name<input id="cgName" maxlength="45" placeholder="e.g. Alex" autocomplete="off"></label><label class="field">Permanent relationship role<select id="cgRole">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></label><label class="field hide" id="customRoleBox">Custom role<input id="cgCustom" maxlength="30" placeholder="Relationship"></label><div class="card"><p>Caregiver NFC band</p><button class="btn alt" onclick="scanFor('caregiver')">Scan caregiver tag</button><div class="small muted" id="tagStatus">No tag scanned yet</div></div><p class="small muted">Relationship role is permanent once saved. You can replace a lost band later without losing care history.</p>`,[{label:'Back',alt:true,fn:()=>{page=wizard?.kind==='first'?'welcome':'settings';render()}},{label:'Save Caregiver',fn:saveCaregiver}]);$('cgRole').onchange=()=>$('customRoleBox').classList.toggle('hide',$('cgRole').value!=='Custom')}
function saveCaregiver(){const name=$('cgName').value.trim(),role=$('cgRole').value==='Custom'?$('cgCustom').value.trim():$('cgRole').value,tag=wizard?.newTag;if(!name||!role)return showToast('Enter a name and role.');if(!tag)return showToast('Scan the caregiver NFC band first.');if(db.caregivers.some(c=>c.tag===tag))return showToast('This band belongs to another caregiver.');const c={id:uid(),name,role,tag};db.caregivers.push(c);save();beep(730);if(wizard?.kind==='first'){wizard.caregiverId=c.id;page='caregiverMore'}else{page='settings'}render();if(page==='caregiverMore')moreCaregiversScreen()}
function moreCaregiversScreen(){page='caregiverMore';screen(`<h1>Add another caregiver?</h1><p>You can always add more caregivers later.</p><div class="card">${db.caregivers.map(c=>`<p><b>${safe(c.name)}</b> · ${safe(c.role)}</p>`).join('')}</div>`,[{label:'Add Another',alt:true,fn:()=>{wizard.newTag=null;page='caregiver';render()}},{label:'Next',fn:()=>{page='baby';render()}}])}
function babyScreen(){screen(`<h1>Add your ${db.babies.length?'new':'first'} baby.</h1><label class="field">Baby's name<input id="babyName" maxlength="45" placeholder="Baby name"></label><label class="field">Gender<select id="babyGender"><option>Girl</option><option>Boy</option><option>Other / Prefer not to say</option></select></label><label class="field">Age method<select id="ageMode"><option value="months">Age in months</option><option value="birth">Birth date (updates automatically)</option></select></label><label class="field" id="monthsBox">Age (0–24 months)<input id="babyMonths" type="number" min="0" max="24" value="0"></label><label class="field hide" id="birthBox">Birth date<input id="babyBirth" type="date"></label><p class="small muted">Teething ring is required only for babies 3 months or older.</p>`,[{label:'Back',alt:true,fn:()=>{page=wizard?.kind==='first'?'caregiverMore':'home';render()}},{label:'Next',fn:saveBaby}]);$('ageMode').onchange=()=>{$('monthsBox').classList.toggle('hide',$('ageMode').value==='birth');$('birthBox').classList.toggle('hide',$('ageMode').value!=='birth')}}
function saveBaby(){const name=$('babyName').value.trim(),ageMode=$('ageMode').value,months=Number($('babyMonths').value),birth=$('babyBirth').value;if(!name)return showToast('Enter a baby name.');if(ageMode==='months'&&(!Number.isInteger(months)||months<0||months>24))return showToast('Choose an age from 0 to 24 months.');if(ageMode==='birth'&&(!birth||new Date(birth)>new Date()))return showToast('Enter a valid birth date.');const b={id:uid(),name,gender:$('babyGender').value,ageMode,months,birth,primaryId:null};db.babies.push(b);wizard ||= {};wizard.babyId=b.id;save();page='primary';render()}
function primaryScreen(){const b=babyById(wizard?.babyId);if(!b)return goHome();screen(`<h1>Who will be ${safe(b.name)}'s primary caregiver?</h1><div class="scrolllist">${db.caregivers.map(c=>`<button class="choice ${wizard.caregiverId===c.id?'selected':''}" onclick="wizard.caregiverId='${c.id}';render()"><span class="grow">${safe(c.name)}</span><span class="pill">${safe(c.role)}</span></button>`).join('')}</div>`,[{label:'Next',fn:()=>{if(!wizard.caregiverId)return showToast('Choose a caregiver.');b.primaryId=wizard.caregiverId;save();page='accessories';render()}}])}
function accessoriesScreen(){const b=babyById(wizard?.babyId||session?.babyId);if(!b)return goHome();const items=neededItems(b),done=items.filter(([k])=>db.tags[k]).length;screen(`<h1>${safe(b.name)}'s accessories</h1><p class="muted">Scan each required accessory once. Registered accessories can be shared with all babies.</p><div class="progress"><div style="width:${100*done/items.length}%"></div></div><p class="small">${done} of ${items.length} required accessories registered</p><div class="scrolllist">${items.map(([k,label])=>`<div class="checkrow"><span class="${db.tags[k]?'ok':'bad'}">${db.tags[k]?'✓':'✕'}</span><strong>${safe(label)}</strong><button class="btn alt small" style="padding:6px 9px;min-height:34px" onclick="scanFor('accessory','${k}')">${db.tags[k]?'Replace':'Scan'}</button></div>`).join('')}<div class="checkrow"><span class="${db.tags.pacifier?'ok':'muted'}">${db.tags.pacifier?'✓':'○'}</span><strong>Pacifier (optional)</strong><button class="btn alt" style="padding:6px 9px;min-height:34px" onclick="scanFor('accessory','pacifier')">Scan</button></div></div><p class="small muted">If you don't have a physical item during a simulation, tap your caregiver band to use the fallback. Registering stickers is still required for the standard setup.</p>`,[{label:'Back',alt:true,fn:()=>{page='primary';render()}},{label:'Next',fn:()=>{if(!allRegistered(b))return showToast('Register the required tags to continue.');wizard=null;session={babyId:b.id};page='modes';render()}}])}
// The choose route is the returning-user baby picker.
function chooseScreen(){homeScreen()}
function homeScreen(){if(!db.caregivers.length){page='welcome';return welcomeScreen()}screen(`<h1>Choose a baby to begin</h1>${session?.running?`<div class="notice"><b>Active Session</b> · ${safe(babyById(session.babyId)?.name)} ${session.paused?'(Paused)':''}<button class="btn alt" style="margin-top:9px;width:100%" onclick="page='live';render()">Return to session</button></div>`:''}<div class="scrolllist">${db.babies.map(b=>`<button class="choice" onclick="chooseBaby('${b.id}')"><span class="grow">${safe(b.name)}<div class="small muted">${ageMonths(b)} months · ${safe(b.gender)}</div></span><span>›</span></button>`).join('')}</div><button class="choice" onclick="beginWizard('newbaby')"><span class="grow">＋ Add a new baby</span></button><div class="grid2"><button class="btn alt" onclick="page='settings';render()">Caregivers & Settings</button><button class="btn alt" onclick="page='reports';render()">Report Cards</button></div>`,[])}
function chooseBaby(id){const b=babyById(id);if(!b)return;if(!b.primaryId){wizard={babyId:id,caregiverId:null};page='primary'}else if(!allRegistered(b)){wizard={babyId:id,caregiverId:b.primaryId};page='accessories'}else{session={babyId:id};page='modes'}render()}
function modesScreen(){const b=babyById(session?.babyId);if(!b)return goHome();screen(`<h1>Choose a simulation</h1><p class="muted">${safe(b.name)} · ${ageMonths(b)} months</p><button class="choice" onclick="startMode('demo')"><span class="grow">🎓 Demo<div class="small muted">Guided, immediate accessory practice</div></span>›</button><div class="card"><h2>Classic</h2><div class="grid2"><button class="btn alt" onclick="startMode('easy')">Easy</button><button class="btn alt" onclick="startMode('medium')">Medium</button><button class="btn alt" onclick="startMode('hard')">Hard</button><button class="btn alt" onclick="startMode('sick')">Sick (Cold)</button></div><p class="small muted">Babies can develop mild cold symptoms in other modes, too.</p></div><button class="choice" onclick="startMode('daycare')"><span class="grow">🕒 Daycare<div class="small muted">Care needs arise in scheduled windows</div></span>›</button>`,[{label:'Back',alt:true,fn:goHome}])}
function startMode(mode){session={babyId:session.babyId,mode,caregiverId:babyById(session.babyId).primaryId,started:0,score:100,events:[],completed:0,paused:false,running:false,need:null,needSince:0,nextAt:0,warningCount:0,step:0,feedingStage:'',ounces:0,deadline:0,prepEnd:Date.now()+300000,grace:mode==='easy'?85000:mode==='medium'?60000:mode==='hard'?40000:mode==='sick'?35000:mode==='daycare'?75000:999999};page='prepare';render()}
function prepareScreen(){const b=babyById(session?.babyId);if(!b)return goHome();screen(`<h1>Get ready for ${safe(b.name)}!</h1><p>Gather everything you need for baby's simulation.</p><div class="card center"><div class="score" id="prepClock">5:00</div><p class="muted">Preparation time remaining</p></div><p class="notice">The simulation will <b>never start automatically</b>. You decide when you're ready.</p><button class="btn alt" onclick="session.prepEnd+=300000;updatePrepClock()">I Need More Time (+5 min)</button><div class="card"><p><b>Starting caregiver</b></p><select id="startCg" onchange="session.caregiverId=this.value">${db.caregivers.map(c=>`<option value="${c.id}" ${session.caregiverId===c.id?'selected':''}>${safe(c.name)} (${safe(c.role)})</option>`).join('')}</select></div>`,[{label:'Back',alt:true,fn:()=>{page='modes';render()}},{label:"I'm Ready",fn:beginSession}]);updatePrepClock()}
function updatePrepClock(){if(page!=='prepare'||!session)return;const s=Math.max(0,Math.ceil((session.prepEnd-Date.now())/1000));if($('prepClock'))$('prepClock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function beginSession(){session.running=true;session.started=Date.now();session.nextAt=Date.now()+(session.mode==='demo'?0:10000);session.step=0;session.events=[];session.score=100;session.completed=0;page='live';render();startNfcListener();if(session.mode==='demo')activateNextNeed();else showToast('Simulation started. Keep this page open for NFC scans.')}
function modeNeeds(){let a=NEEDS.filter(n=>n.id!=='teether'||ageMonths(babyById(session.babyId))>=3);if(!db.tags.pacifier)a=a.filter(n=>n.id!=='pacifier');return a}
function activateNextNeed(){if(!session?.running||session.paused)return;let options=modeNeeds();if(session.mode==='demo'){if(session.step>=options.length){finishSession();return}session.need={...options[session.step]};}else{const pool=options.filter(n=>n.id!=='medicine'||session.mode==='sick'||Math.random()<.15);session.need={...pool[Math.floor(Math.random()*pool.length)]};}session.needSince=Date.now();session.warningCount=0;session.penalized=false;session.feedingStage='';session.ounces=0;session.deadline=0;session.events.push({type:'need',id:session.need.id,at:Date.now(),caregiverId:session.caregiverId});if(session.need.id==='feed')showToast('Neh… baby is hungry.');else if(session.need.id==='sleep')showToast('Owh… baby is sleepy.');else if(session.need.id==='nose')showToast('Baby has a stuffy nose.');render();syncBabyCry()}
function liveScreen(){if(!session?.running)return goHome();const b=babyById(session.babyId),cg=caregiverById(session.caregiverId),n=session.need;screen(`<h1>${safe(b.name)} · ${safe(session.mode.toUpperCase())}</h1><div class="inline"><span class="pill">${safe(cg?.name||'Caregiver')} · ${safe(cg?.role||'')}</span><span class="pill">Score: <b id="liveScore">${session.score}%</b></span><span class="pill" id="liveTime">00:00</span></div>${session.paused?`<div class="card center"><h2>⏸ On a break</h2><p>Baby's needs, timers, sounds and scoring are paused.</p></div>`:`<div class="card"><h2>${n?safe(n.label):'Baby is content 🤍'}</h2><p>${n?safe(n.message):'Keep an eye on baby. The next care need is coming.'}</p>${n?`<p class="notice">${safe(n.prompt)}</p><p class="small muted" id="careTime">Waiting for care…</p>`:''}${n?.id==='feed'?`<p id="feedInfo" class="small">${session.feedingStage==='making'?'Bottle scanned. Tap Bottle Made.':session.feedingStage==='settling'?'Bottle prepared. Baby is settling…':session.feedingStage==='burp'?'1 oz finished. Scan caregiver band to burp.':session.feedingStage==='continue'?'Scan bottle again for the next ounce.':session.feedingStage==='done'?'Feeding complete.':'Scan bottle to prepare feeding.'}</p>${session.feedingStage==='making'?`<button class="btn" onclick="bottleMade()">Bottle Made</button>`:''}`:''}</div>`}<div class="card"><h2>NFC reader</h2><p class="small" id="nfcState">${scannerActive?'Listening for NFC tags':'Tap Enable NFC to start scanning'}</p><button class="btn alt" onclick="startNfcListener()">Enable / Restart NFC</button><p class="small muted">Any registered caregiver band switches caregiver immediately. If an item is missing, scan the caregiver band and choose the fallback.</p></div><div class="grid2"><button class="btn alt" onclick="togglePause()">${session.paused?'Resume':'I Need a Break'}</button><button class="btn alt" onclick="finishSession()">End Simulation</button></div>${session.mode==='demo'?`<p class="small muted">Guided demo: ${session.step+1} of ${modeNeeds().length} care activities. No changes to saved live reports.</p>`:''}`,[])}
function togglePause(){if(!session?.running)return;if(!session.paused){session.paused=true;session.pauseAt=Date.now();session.events.push({type:'break',at:Date.now()});}else{const delta=Date.now()-session.pauseAt;session.paused=false;session.needSince+=delta;session.nextAt+=delta;session.deadline+=session.deadline?delta:0;session.started+=delta;}render();syncBabyCry()}
function tick(){if(page==='prepare')updatePrepClock();if(!session?.running||session.paused)return;const now=Date.now();if(page==='live'){$('liveScore')&&($('liveScore').textContent=session.score+'%');$('liveTime')&&($('liveTime').textContent=formatTime(now-session.started));$('careTime')&&($('careTime').textContent='Waiting '+formatTime(now-session.needSince));}
if(!session.need&&now>=session.nextAt){activateNextNeed();return}if(!session.need)return;
if(session.feedingStage==='settling'&&now>=session.deadline){session.feedingStage='burp';session.ounces++;showToast('1 ounce finished! Scan caregiver band to burp.');render();return}
if(session.need.id==='feed'&&!session.feedingStage&&session.warningCount<5&&now-session.needSince>=session.warningCount*4000){session.warningCount++;if(session.warningCount<=5)showToast('Neh… hungry warning '+session.warningCount+'/5');}
if(!session.penalized&&now-session.needSince>session.grace&&session.feedingStage!=='settling'&&session.feedingStage!=='burp'&&session.feedingStage!=='making'){session.penalized=true;session.score=Math.max(0,session.score-10);session.events.push({type:'late',need:session.need.id,at:now,caregiverId:session.caregiverId});beep(210,400);showToast('Care was delayed. −10 points.');}
}
function formatTime(ms){const t=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function bottleMade(){if(!session?.need||session.need.id!=='feed'||session.feedingStage!=='making')return;session.feedingStage='settling';session.deadline=Date.now()+10000;session.events.push({type:'bottle-made',at:Date.now()});showToast('Bottle made. Baby settles in 10 seconds.');render()}
function handleLiveTag(value){if(!session?.running||session.paused)return;const caregiver=db.caregivers.find(c=>c.tag===value);if(caregiver){session.caregiverId=caregiver.id;session.events.push({type:'caregiver',caregiverId:caregiver.id,at:Date.now()});beep(740);showToast(caregiver.role+' Detected!');if(session.need?.id==='feed'&&session.feedingStage==='burp'){session.events.push({type:'burp',caregiverId:caregiver.id,at:Date.now()});if(session.ounces>=2){resolveNeed('Caregiver burped baby after feeding');}else{session.feedingStage='continue';render()}}else if(session.need){if(session.need.id==='pacifier'){resolveNeed('Comforted by caregiver');}else{showFallback(caregiver)}}else render();return}
const k=Object.keys(db.tags).find(k=>db.tags[k]===value);if(!k){showToast('Unknown tag. Register it in Settings.');return}const n=session.need;if(!n){showToast(ITEMS.find(x=>x[0]===k)?.[1]+' scanned. Baby is content.');return}if(n.id==='feed'){if(k!=='bottle')return showToast('Baby needs the bottle first.');if(!session.feedingStage||session.feedingStage==='continue'){session.feedingStage='making';session.events.push({type:'bottle',at:Date.now(),caregiverId:session.caregiverId});showToast('Bottle detected! Tap Bottle Made.');render();}else showToast('Follow the feeding step on screen.');return}
if(n.item===k||(n.id==='diaper'&&k==='diaper2')){if(n.id==='temperature')showToast('Simulated temperature: 98.6°F.');resolveNeed(ITEMS.find(x=>x[0]===k)?.[1]+' scanned');}else showToast('Not the requested item. '+n.prompt)}
function showFallback(c){const n=session.need;if(!n)return;const existing=$('fallbackBox');if(existing)existing.remove();const box=document.createElement('div');box.id='fallbackBox';box.className='card';box.innerHTML=`<h2>Caregiver band detected</h2><p>${safe(c.name)} is caring for ${safe(babyById(session.babyId).name)}.</p><p>Don't have ${safe(ITEMS.find(x=>x[0]===n.item)?.[1])}? You can use the caregiver-band fallback. It will be marked as assisted care on the report.</p><button class="btn alt" id="fallbackBtn">Use caregiver fallback</button>`;$('screen')?.append(box);$('fallbackBtn').onclick=()=>resolveNeed('Caregiver fallback',true)}
function resolveNeed(method,fallback=false){const n=session.need;if(!n)return;const delay=Date.now()-session.needSince;session.events.push({type:'resolved',need:n.id,at:Date.now(),delay,method,fallback,caregiverId:session.caregiverId});session.completed++;session.need=null;stopBabyCry();session.feedingStage='';session.penalized=false;session.nextAt=Date.now()+(session.mode==='demo'?999999:session.mode==='daycare'?45000:session.mode==='easy'?35000:session.mode==='medium'?25000:15000);if(fallback)session.score=Math.max(0,session.score-2);else session.score=Math.min(100,session.score+1);beep(690);showToast('Care complete! '+(fallback?'Assisted care recorded.':'Well done!'));if(session.mode==='demo'){session.step++;if(session.step>=modeNeeds().length){finishSession();return}session.need=null;page='live';render();const el=document.createElement('div');el.className='card';el.id='demoNext';el.innerHTML='<p>Great job! Ready for the next accessory?</p><button class="btn" id="demoAdvance">Next Care Activity</button>';$('screen').prepend(el);$('demoAdvance').onclick=()=>{el.remove();activateNextNeed()}}else render()}
function finishSession(){if(!session)return;stopBabyCry();const s=session;s.running=false;s.ended=Date.now();const resolutions=s.events.filter(e=>e.type==='resolved');const late=s.events.filter(e=>e.type==='late');s.score=Math.max(0,Math.min(100,s.score));s.grade=s.score>=90?'A':s.score>=80?'B':s.score>=70?'C':s.score>=60?'D':'F';if(s.mode!=='demo'){db.reports.unshift({id:uid(),babyId:s.babyId,mode:s.mode,at:s.ended,score:s.score,grade:s.grade,events:s.events,completed:resolutions.length,late:late.length});db.reports=db.reports.slice(0,100);save()}stopNfc();page='report';render();beep(s.score>=70?820:190,350)}
function reportScreen(){const s=session;if(!s)return goHome();const resolutions=s.events.filter(e=>e.type==='resolved'),late=s.events.filter(e=>e.type==='late');const grade=s.grade||'A';const cgStats=db.caregivers.map(c=>({c,done:resolutions.filter(e=>e.caregiverId===c.id).length})).filter(x=>x.done||x.c.id===s.caregiverId);screen(`<h1>${s.mode==='demo'?'Demo':'Simulation'} Report Card</h1><div class="card center"><div class="score grade${grade}">${grade}</div><h2>${s.score}%</h2><p>${safe(babyById(s.babyId)?.name)} · ${safe(s.mode)}</p></div><div class="grid2"><div class="card center"><b>${resolutions.length}</b><span class="small">Care activities</span></div><div class="card center"><b>${late.length}</b><span class="small">Delayed responses</span></div></div><div class="card"><h2>Caregivers</h2>${cgStats.map(x=>`<p>${safe(x.c.name)} (${safe(x.c.role)}): ${x.done} care actions</p>`).join('')||'<p>No completed care yet.</p>'}</div><button class="link" onclick="$('tips').classList.toggle('hide')">What can you do better?</button><div class="card hide" id="tips">${late.length?`<p>Respond sooner to: ${safe([...new Set(late.map(x=>NEEDS.find(n=>n.id===x.need)?.label||x.need))].join(', '))}.</p>`:'<p>Nice work responding promptly! Keep following the care prompts.</p>'}${resolutions.some(e=>e.fallback)?'<p>Try using the physical accessory tags when available; caregiver fallback was used.</p>':''}<p>Response times: ${resolutions.length?resolutions.map(e=>`${safe(NEEDS.find(n=>n.id===e.need)?.label||e.need)} ${formatTime(e.delay)}`).join(' · '):'None yet'}</p></div>${s.mode==='demo'?'<p class="small muted">Demo report only. It was not added to your live history.</p>':''}`, [{label:'Choose Baby',alt:true,fn:goHome},{label:s.mode==='demo'?'Restart Demo':'New Simulation',fn:()=>{const id=s.babyId;session={babyId:id};page='modes';render()}}])}
function settingsScreen(){screen(`<h1>Caregivers & Settings</h1><h2>Caregivers</h2><div class="scrolllist">${db.caregivers.map(c=>`<div class="card"><p><b>${safe(c.name)}</b> · ${safe(c.role)}</p><div class="inline"><button class="btn alt small" onclick="replaceBand('${c.id}')">Replace NFC Band</button><button class="btn alt small" onclick="removeCaregiver('${c.id}')">Remove</button></div></div>`).join('')}</div><button class="btn alt" onclick="wizard={kind:'addcaregiver',newTag:null};page='caregiver';render()">＋ Add Caregiver</button><h2>Video setup help</h2><label class="field">YouTube video URL<input id="helpUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." value="${safe(db.settings.helpUrl||'')}"></label><button class="btn alt" onclick="saveHelpUrl()">Save Video Link</button><div class="card"><h2>Sound</h2><label class="inline"><input type="checkbox" ${toneEnabled?'checked':''} onchange="toneEnabled=this.checked"> Enable notification tones</label><p class="small muted">Freesound page links aren't directly playable audio files. Add licensed local sound files to the app to enable the requested recordings.</p></div>`,[{label:'Done',fn:goHome}])}
function saveHelpUrl(){const v=$('helpUrl').value.trim();if(v&&!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(v))return showToast('Use a YouTube URL.');db.settings.helpUrl=v;save();showToast('Video link saved.')}
function replaceBand(id){const c=caregiverById(id);if(!c)return;scanFor('replace',id)}
function removeCaregiver(id){const c=caregiverById(id);if(!c||!confirm('Remove '+c.name+'? Past report data will remain but the profile will be removed.'))return;if(db.caregivers.length<=1)return showToast('Keep at least one caregiver.');db.caregivers=db.caregivers.filter(x=>x.id!==id);db.babies.forEach(b=>{if(b.primaryId===id)b.primaryId=db.caregivers[0].id});save();render()}
function reportsScreen(){screen(`<h1>Saved Report Cards</h1><div class="scrolllist">${db.reports.map(r=>`<div class="card"><p><b>${safe(babyById(r.babyId)?.name||'Baby')}</b> · ${new Date(r.at).toLocaleDateString()}</p><p><b class="grade${r.grade}">${r.grade} · ${r.score}%</b> · ${safe(r.mode)} · ${r.completed} tasks</p></div>`).join('')||'<p>No saved simulations yet.</p>'}</div>`,[{label:'Back',fn:goHome}])}
function cancelPending(){pendingScan=null}
async function scanFor(type,id){if(!('NDEFReader'in window)){showToast('Web NFC requires Android Chrome, NFC enabled, and HTTPS.');return}pendingScan={type,id};if(type==='caregiver')wizard.newTag=null;showToast('Hold your phone near the NFC sticker…');await startNfcListener()}
async function startNfcListener(){if(!('NDEFReader'in window)){showToast('Web NFC is unavailable here. Use Android Chrome over HTTPS.');return}if(scannerActive){if($('nfcState'))$('nfcState').textContent='Listening for NFC tags';return}try{nfcController=new AbortController();const reader=new NDEFReader();await reader.scan({signal:nfcController.signal});reader.addEventListener('reading',e=>{for(const record of e.message.records){if(record.recordType==='text'){let value='';try{value=new TextDecoder(record.encoding||'utf-8').decode(record.data).trim()}catch{}if(value){receiveTag(value);break}}}});reader.addEventListener('readingerror',()=>showToast('Could not read tag. Try again.'));scannerActive=true;if($('nfcState'))$('nfcState').textContent='Listening for NFC tags';showToast('NFC ready. Tap a sticker.')}catch(err){scannerActive=false;showToast('NFC could not start: '+(err?.message||'Permission denied'))}}
function stopNfc(){try{nfcController?.abort()}catch{}nfcController=null;scannerActive=false;pendingScan=null}
function receiveTag(value){if(pendingScan){const p=pendingScan;pendingScan=null;if(p.type==='caregiver'){if(db.caregivers.some(c=>c.tag===value)){showToast('That tag is already assigned.');return}wizard.newTag=value;const el=$('tagStatus');if(el)el.textContent='✓ Tag detected: '+value;beep(720);return}if(p.type==='replace'){const c=caregiverById(p.id);if(!c)return;if(db.caregivers.some(x=>x.id!==c.id&&x.tag===value))return showToast('Tag already belongs to another caregiver.');c.tag=value;save();beep(730);showToast(c.name+' band replaced.');render();return}if(p.type==='accessory'){const collision=Object.keys(db.tags).find(k=>k!==p.id&&db.tags[k]===value);if(collision)return showToast('That tag is assigned to another accessory.');if(db.caregivers.some(c=>c.tag===value))return showToast('This is a caregiver tag. Use another sticker.');db.tags[p.id]=value;save();beep(730);showToast((ITEMS.find(x=>x[0]===p.id)?.[1]||p.id)+' registered!');render();return}}if(session?.running)handleLiveTag(value)}
window.goHome=goHome;window.beginWizard=beginWizard;window.openHelpVideo=openHelpVideo;window.scanFor=scanFor;window.saveCaregiver=saveCaregiver;window.saveBaby=saveBaby;window.chooseBaby=chooseBaby;window.startMode=startMode;window.beginSession=beginSession;window.startNfcListener=startNfcListener;window.togglePause=togglePause;window.finishSession=finishSession;window.bottleMade=bottleMade;window.saveHelpUrl=saveHelpUrl;window.replaceBand=replaceBand;window.removeCaregiver=removeCaregiver;window.render=render;window.page=page;window.wizard=wizard;window.session=session;
// Keep inline onclick references synchronized with state changes.
Object.defineProperty(window,'page',{get:()=>page,set:v=>page=v});Object.defineProperty(window,'wizard',{get:()=>wizard,set:v=>wizard=v});Object.defineProperty(window,'session',{get:()=>session,set:v=>session=v});
document.addEventListener('pointerdown',()=>{if(session?.running&&session.need&&!session.paused&&babyCry.paused)syncBabyCry()});
setInterval(tick,1000);render();
</script></body></html>
